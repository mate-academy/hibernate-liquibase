databaseChangeLog:
  - changeSet:
      id: create-movie-table
      author: Artem

      changes:
        - createTable:
            tableName: actors

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: country_id
                  type: BIGINT