databaseChangeLog:
  - changeSet:
      id: create-countries-table
      author: Artem

      changes:
        - createTable:
            tableName: countries

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: name
                  type: VARCHAR(255)
