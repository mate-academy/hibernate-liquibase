databaseChangeLog:
  - changeSet:
      id: create-movies-actors
      author: your_name
      changes:
        - createTable:
            tableName: movies_actors
            columns:
              - column:
                  name: movie_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    foreignKeyName: fk_ma_movie
                    references: movies(id)
              - column:
                  name: actor_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    foreignKeyName: fk_ma_actor
                    references: actors(id)
