databaseChangeLog:
  - changeSet:
      id: create-movies-actors-table
      author: Igor
      changes:
        - createTable:
            tableName: movies_actors
            columns:
              - column:
                  name: movie_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: actor_id
                  type: bigint
                  constraints:
                    nullable: false

        - addPrimaryKey:
            columnNames: movie_id, actor_id
            constraintName: pk_movies_actors
            tableName: movies_actors

        - addForeignKeyConstraint:
            baseColumnNames: movie_id
            baseTableName: movies_actors
            constraintName: fk_ma_movie
            onDelete: CASCADE
            onUpdate: RESTRICT
            referencedColumnNames: id
            referencedTableName: movies

        - addForeignKeyConstraint:
            baseColumnNames: actor_id
            baseTableName: movies_actors
            constraintName: fk_ma_actor
            onDelete: CASCADE
            onUpdate: RESTRICT
            referencedColumnNames: id
            referencedTableName: actors
