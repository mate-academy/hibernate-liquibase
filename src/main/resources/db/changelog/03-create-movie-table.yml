databaseChangeLog:
  - changeSet:
      id: create-movie-table
      author: vlad
      changes:
        - createTable:
            tableName: movies
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: true
  - changeSet:
      id: create-common-movies_actors-table
      author: vlad
      changes:
        - createTable:
            tableName: movies_actors
            columns:
              - column:
                  name: movie_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_movie
                    referencedTableName: movies
                    referencedColumnNames: id
              - column:
                  name: actor_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_actor
                    referencedTableName: actors
                    referencedColumnNames:
