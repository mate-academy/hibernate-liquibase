databaseChangeLog:
  - changeSet:
      id: create-countries-table
      author: ReduxR
      changes:
        - createTable: 
            tableName: countries
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: true
              - column: 
                  name: name
                  type: varchar(255)       