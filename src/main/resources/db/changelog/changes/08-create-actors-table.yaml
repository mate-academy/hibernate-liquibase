databaseChangeLog:
  - changeSet:
      id: 08-create-actors-table
      author: twoje_imie
      changes:
        - createTable:
            tableName: actors
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: country_id
                  type: bigint
                  constraints:
                    nullable: true # <--- ZMIEŃ Z false NA true
                    foreignKeyName: fk_actors_countries
                    referencedTableName: countries
                    referencedColumnNames: id
