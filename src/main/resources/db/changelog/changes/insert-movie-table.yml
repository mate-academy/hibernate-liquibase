databaseChangeLog:
  - changeSet:
      id: 1
      author: a.pietkiewicz
      changes:
        - createTable:
            tableName: movies
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(50)
              - column:
                  name: actors
                  type: varchar(50)
  - changeSet:
      id: 2
      author: apietkiewicz
      changes:
        - createTable:
            tableName: movies_actors
            columns:
              - column:
                  name: movie_id
                  type: bigint
              - column:
                  name: actor_id
                  type: bigint
