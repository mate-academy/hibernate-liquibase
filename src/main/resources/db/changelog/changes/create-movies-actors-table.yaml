databaseChangeLog:
  - changeSet:
      id: create-movies-actors-table
      author: sofiiakhapal
      changes:
        - createTable:
            tableName: movies_actors
            columns:
              - column:
                  name: movie_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: actor_id
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: movies_actors
            referencedTableName: movies
            baseColumnNames: movie_id
            referencedColumnNames: id
            constraintName: fk_movie_actor
        - addForeignKeyConstraint:
            baseTableName: movies_actors
            referencedTableName: actors
            baseColumnNames: actor_id
            referencedColumnNames: id
            constraintName: fk_actor_movie