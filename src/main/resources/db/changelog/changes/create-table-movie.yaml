databaseChangeLog:
  - changeSet:
      id: 1795119831187-1
      author: mac
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_movies
                  name: id
                  type: BIGINT
              - column:
                  name: title
                  type: VARCHAR(255)
            tableName: movies
  - changeSet:
      id: 1795119831187-2
      author: mac
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                  name: actor_id
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: movie_id
                  type: BIGINT
            tableName: movies_actors
  - changeSet:
      id: 1795119831187-3
      author: mac
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: actor_id
            baseTableName: movies_actors
            constraintName: fk_movact_on_actor
            referencedColumnNames: id
            referencedTableName: actors
  - changeSet:
      id: 1795119831187-4
      author: mac
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: movie_id
            baseTableName: movies_actors
            constraintName: fk_movact_on_movie
            referencedColumnNames: id
            referencedTableName: movies

