databaseChangeLog:
  - changeSet:
      id: create-actors-table
      author: me
      changes: 
        - createTable:
            tableName: actors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)

              - column:
                  name: country_id
                  type: BIGINT

        - addForeignKeyConstraint:
            constraintName: fk_actors_country
            baseTableName: actors
            baseColumnNames: country_id
            referencedTableName: countries
            referencedColumnNames: id