databaseChangeLog:
  - changeSet:
      id: 02-create-actors-table
      author: dima
      changes:
        - createTable:
            tableName: actors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_actors
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)

              - column:
                  name: country_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: actors
            baseColumnNames: country_id
            constraintName: fk_actors_country
            referencedTableName: countries
            referencedColumnNames: id