databaseChangeLog:
  - changeSet:
      id: create-country-tables
      author: mateacademy
      changes:
        - createTable:
            tableName: movies_actors
            columns:
              - column:
                  name: movie_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_movie_id
                    references: movies(id)
                    nullable: false
              - column:
                  name: actor_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_actor_id
                    references: actors(id)
                    nullable: false
