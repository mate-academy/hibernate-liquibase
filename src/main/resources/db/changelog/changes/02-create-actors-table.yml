databaseChangeLog:
  - changeSet: 
      id: create-actors-table
      author: ReduxR
      changes:
        - createTable: 
            tableName: actors
            columns:
              - column: 
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: true
              - column: 
                  name: name
                  type: varchar(255)
              - column: 
                  name: country_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_actors_country
                    referencedTableName: countries
                    referencedColumnNames: id