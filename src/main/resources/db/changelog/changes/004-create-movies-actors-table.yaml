databaseChangeLog:
  - changeSet:
      id: 004-create-movies-actors-table
      author: Krupko Illia
      changes:
        - createTable:
            tableName: movies_actors
            columns:
              - column:
                  name: actor_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: movie_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_movies_actors_movie
            baseTableName: movies_actors
            baseColumnNames: movie_id
            referencedTableName: movies
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_movies_actors_actor
            baseTableName: movies_actors
            baseColumnNames: actor_id
            referencedTableName: actors
            referencedColumnNames: id

        - addUniqueConstraint:
            tableName: movies_actors
            columnNames: movie_id, actor_id
