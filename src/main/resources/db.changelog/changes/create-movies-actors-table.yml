databaseChangeLog:
  - changeSet:
      id: 03-create-movies-actors-table
      author:  liudmylabiletska
      changes:
        - createTable:
            tableName: movies_actors
            columns:
              - column:
                  name: movie_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: actor_id
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: movies_actors
            baseColumnNames: movie_id
            constraintName: fk_movie
            referencedTableName: movies
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: movies_actors
            baseColumnNames: actor_id
            constraintName: fk_actor
            referencedTableName: actors
            referencedColumnNames: id
